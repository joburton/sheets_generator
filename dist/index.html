<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sheets generator — SABIN</title><meta name="description" content="Build your own submission document stack."><link rel="icon" href="assets/sabin.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=20260916-3"></head>
<body><main class="workspace"><aside class="toolbar" aria-label="Document controls"><div class="intro"><h1>SHEETS<br>GENERATOR</h1><p>Build your own submission document stack</p></div>
<section><label class="field"><span>Choose a cover</span><select id="cover"><option value="suspension-methods">Suspension methods</option><option value="methods-of-construction">Methods of construction</option><option value="unique-to-sabin">Unique to SABIN</option><option value="materials">Materials</option><option value="colors">Colors</option><option value="custom">Make custom cover</option></select></label><div id="custom-fields" hidden><label class="field"><span>Title</span><textarea class="suggested" id="title" rows="2" maxlength="180" placeholder="Your document title">Suspension methods</textarea></label><label class="field copy"><span>Cover copy</span><textarea class="suggested" id="copy" rows="5" maxlength="1200">How to specify:
Mark preferred method on product cut sheet
Contact info@sabin.design</textarea></label></div></section>
<section><h2>Topic modules</h2><p class="note sequence-note" id="reorder-help">Drag from handle to reorder</p><div id="modules" role="list" aria-label="Topic modules in document order"></div><span id="reorder-status" class="sr-only" aria-live="polite"></span></section><footer><div id="error" role="alert" hidden></div><button id="download" class="download" disabled><span class="cover-arrow download-arrow" aria-hidden="true">→</span><span class="download-label">Download PDF</span></button><p class="note" id="stack-summary">Preparing your stack…</p></footer></aside>
<section class="preview" aria-label="Document preview"><div class="paper-area"><div class="paper"><canvas id="page" aria-label="PDF page preview"></canvas><div id="loading" role="status">Preparing your cover…</div></div></div><nav class="pager" aria-label="Preview pages"><button id="prev" aria-label="Previous page" disabled><span class="cover-arrow previous-arrow" aria-hidden="true">→</span></button><div><span id="page-counter" aria-live="polite">Page 1</span><span id="page-name">Cover</span></div><button id="next" aria-label="Next page" disabled><span class="cover-arrow" aria-hidden="true">→</span></button></nav><p class="preview-note">US Letter · Portrait</p></section></main>
<script src="vendor/pdf-lib.min.js"></script><script src="vendor/fontkit.umd.min.js"></script><script type="module" src="app.js"></script></body></html>
